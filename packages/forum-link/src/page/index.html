<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forum Link</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f5f6f8;
        color: #1c2128;
        overflow-x: hidden;
        word-break: break-word;
        padding-bottom: 200px;
      }
      [hidden] {
        display: none !important;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 12px 12px 24px;
      }
      .topbar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 8px 0 14px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h2 {
        font-size: 15px;
        margin: 18px 0 10px;
        color: #4b5563;
      }
      .notice {
        background: #fef3c7;
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: #92400e;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        line-height: 18px;
        color: #fff;
        background: #9ca3af;
      }
      .badge-pending {
        background: #d97706;
      }
      .badge-compacting {
        background: #7c3aed;
      }
      .badge-running {
        background: #16a34a;
      }
      .badge-idle {
        background: #6b7280;
      }
      .mono {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: #6b7280;
      }
      .thread-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .thread-card:active {
        background: #f0f4ff;
      }
      .thread-card-title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .thread-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: #6b7280;
      }
      .lastline {
        margin-top: 6px;
        font-size: 13px;
        color: #6b7280;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .offline-flag {
        color: #dc2626;
        font-size: 12px;
        border: 1px solid #fca5a5;
        border-radius: 999px;
        padding: 0 6px;
      }
      .goal-progress {
        color: #2563eb;
      }
      .empty {
        text-align: center;
        color: #9ca3af;
        padding: 24px 0;
        font-size: 14px;
      }
      .group {
        margin-bottom: 14px;
      }
      .group-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 2px 8px;
      }
      .group-name {
        font-weight: 600;
        font-size: 14px;
      }
      .group-host {
        font-size: 12px;
        color: #9ca3af;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .nav-link {
        font-size: 13px;
        color: #2563eb;
        text-decoration: none;
      }
      .login-box {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .login-hint {
        margin: 0;
        font-size: 14px;
        color: #374151;
      }
      #login-token {
        width: 100%;
        min-height: 40px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .login-error {
        margin: 0;
        font-size: 13px;
        color: #dc2626;
      }
      .device-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .device-info {
        min-width: 0;
      }
      .device-name {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .device-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 13px;
        color: #6b7280;
      }
      #btn-back {
        margin-bottom: 10px;
      }
      .thread-title {
        font-size: 17px;
        font-weight: 600;
        margin: 4px 0 6px;
      }
      .thread-info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 13px;
        color: #374151;
        margin-top: 6px;
      }
      .goal-objective {
        margin-top: 6px;
        font-size: 13px;
        color: #374151;
      }
      .todo-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        font-size: 13px;
      }
      .todo-list li {
        padding: 2px 0 2px 18px;
        position: relative;
        color: #6b7280;
      }
      .todo-list li::before {
        content: '○';
        position: absolute;
        left: 0;
      }
      .todo-list li.todo-done {
        color: #16a34a;
        text-decoration: line-through;
      }
      .todo-list li.todo-done::before {
        content: '●';
      }
      .todo-list li.todo-in_progress {
        color: #1c2128;
        font-weight: 600;
      }
      #timeline {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .tl-item {
        margin: 10px 0;
      }
      .msg {
        border-radius: 10px;
        padding: 8px 12px;
        max-width: 92%;
      }
      .msg-user {
        background: #e8f0fe;
      }
      .msg-assistant {
        background: #fff;
        border: 1px solid #e5e7eb;
      }
      .msg-role {
        display: block;
        font-size: 11px;
        color: #6b7280;
        margin-bottom: 4px;
      }
      .msg-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg-trunc {
        display: block;
        font-size: 11px;
        color: #9ca3af;
        margin-top: 4px;
      }
      .tl-mono {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: #6b7280;
      }
      .tl-fail {
        color: #dc2626;
      }
      .tl-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #6b7280;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
        flex: none;
      }
      .card {
        background: #fff;
        border: 1px solid #d3dbe5;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .card-closed {
        border-style: dashed;
      }
      .card-kind {
        font-size: 11px;
        color: #2563eb;
        font-weight: 600;
        margin-bottom: 6px;
        letter-spacing: 0.05em;
      }
      .card-closed .card-kind {
        color: #6b7280;
      }
      .card-outcome {
        font-size: 14px;
      }
      .trunc-note {
        font-size: 12px;
        color: #92400e;
        background: #fef3c7;
        border-radius: 6px;
        padding: 4px 8px;
        margin-bottom: 8px;
      }
      .card-tool {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .tool-name {
        font-weight: 600;
      }
      .tool-action {
        font-size: 13px;
        color: #6b7280;
      }
      .card-desc {
        font-size: 13px;
        color: #374151;
        margin: 0 0 8px;
      }
      .block {
        margin: 8px 0;
      }
      .block-label {
        font-size: 12px;
        color: #6b7280;
        margin-bottom: 4px;
      }
      .block-path {
        margin-bottom: 4px;
      }
      .block-code {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0;
        font-size: 12px;
        font-family: ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 320px;
        overflow: auto;
      }
      .block-brief {
        margin: 0;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .danger-tag {
        display: inline-block;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        padding: 2px 8px;
        margin-bottom: 6px;
      }
      .diff-details {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 6px 8px;
      }
      .diff-details summary {
        cursor: pointer;
        font-size: 12px;
        color: #6b7280;
      }
      .diff-body {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        overflow-x: auto;
      }
      .diff-row {
        display: flex;
        gap: 8px;
        padding: 0 4px;
      }
      .diff-no {
        width: 3em;
        text-align: right;
        color: #9ca3af;
        flex: none;
        user-select: none;
      }
      .diff-text {
        white-space: pre;
      }
      .diff-add .diff-text {
        background: #dcfce7;
        color: #14532d;
      }
      .diff-del .diff-text {
        background: #fee2e2;
        color: #7f1d1d;
      }
      .diff-ctx .diff-text {
        color: #374151;
      }
      .raw-details {
        font-size: 12px;
      }
      .raw-details summary {
        cursor: pointer;
        color: #6b7280;
      }
      .raw-list {
        margin: 6px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
      }
      .raw-list dt {
        color: #9ca3af;
        font-family: ui-monospace, Consolas, monospace;
      }
      .raw-list dd {
        margin: 0;
        font-family: ui-monospace, Consolas, monospace;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .option {
        min-height: 44px;
        text-align: left;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .option:hover:not(:disabled) {
        border-color: #2563eb;
      }
      .option.chosen {
        border-color: #2563eb;
        background: #eef4ff;
      }
      .option-desc {
        font-size: 12px;
        color: #6b7280;
      }
      .option-flag {
        font-size: 11px;
        color: #d97706;
      }
      .q-item {
        margin-bottom: 12px;
      }
      .q-title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .q-header {
        font-size: 12px;
        color: #2563eb;
        margin-bottom: 4px;
      }
      .q-body {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 6px;
        white-space: pre-wrap;
      }
      .free-input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        margin-top: 8px;
        font-family: inherit;
      }
      .card-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 10px;
      }
      .card-note {
        font-size: 12px;
        color: #6b7280;
      }
      .btn {
        min-height: 40px;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn.danger {
        background: #dc2626;
        border-color: #dc2626;
        color: #fff;
      }
      .summary-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }
      .summary-list li {
        margin-bottom: 8px;
      }
      .summary-q {
        font-size: 13px;
        color: #6b7280;
      }
      .summary-a {
        font-size: 14px;
        font-weight: 600;
      }
      #receipts {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .receipt-item {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #f0f1f3;
        font-size: 13px;
      }
      .receipt-badge {
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 12px;
        color: #fff;
        background: #9ca3af;
      }
      .receipt-applied {
        background: #16a34a;
      }
      .receipt-delivered {
        background: #2563eb;
      }
      .receipt-rejected,
      .receipt-lost {
        background: #dc2626;
      }
      #action-bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0;
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: #f5f6f8;
        border-top: 1px solid #e5e7eb;
        z-index: 10;
      }
      .op-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .op-row:not(:has(> *:not([hidden]))) {
        display: none;
      }
      #op-text,
      #goal-objective {
        flex: 1;
        min-width: 140px;
        min-height: 40px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        background: #fff;
        font-family: inherit;
      }
      .op-row select {
        min-height: 40px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 13px;
        background: #fff;
        max-width: 45%;
      }
      .chk {
        font-size: 13px;
        color: #374151;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 16px;
      }
      .modal-panel {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        width: 100%;
        max-width: 380px;
        max-height: 80vh;
        overflow: auto;
      }
      .modal-panel .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      #feedback-input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        font-family: inherit;
      }
      @media (max-width: 640px) {
        .diff-details {
          padding: 4px 6px;
        }
        .diff-body {
          max-height: 200px;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="notice" class="notice" hidden></div>
      <section id="view-login" hidden>
        <header class="topbar"><h1>Forum Link</h1></header>
        <div class="login-box">
          <p class="login-hint">粘贴设备 token 登录</p>
          <input id="login-token" type="text" autocomplete="off" spellcheck="false" placeholder="设备 token" />
          <button id="btn-login" class="btn primary" type="button">登录</button>
          <p id="login-error" class="login-error" hidden></p>
        </div>
      </section>
      <section id="view-inbox" hidden>
        <header class="topbar">
          <h1>Forum Link</h1>
          <a class="nav-link" href="#/devices">设备管理</a>
        </header>
        <section id="inbox-pinned" hidden>
          <h2>待处理</h2>
          <div id="pinned-list"></div>
        </section>
        <section id="inbox-groups">
          <h2>全部机器</h2>
          <div id="group-list"></div>
        </section>
      </section>
      <section id="view-devices" hidden>
        <button id="btn-devices-back" class="btn" type="button">← 收件箱</button>
        <header class="topbar"><h1>设备管理</h1></header>
        <div id="device-list"></div>
      </section>
      <section id="view-thread" hidden>
        <button id="btn-back" class="btn" type="button">← 收件箱</button>
        <header id="thread-head"></header>
        <div id="offline-thread-actions" hidden></div>
        <div id="closed-card-slot" hidden></div>
        <h2>开放卡片</h2>
        <div id="open-cards"></div>
        <h2>时间线</h2>
        <ol id="timeline"></ol>
        <h2>回执</h2>
        <ul id="receipts"></ul>
      </section>
    </main>
    <footer id="action-bar" hidden>
      <div class="op-row">
        <input id="op-text" placeholder="输入消息…" autocomplete="off" />
        <button id="btn-send" class="btn primary" type="button" hidden>发送</button>
        <button id="btn-steer" class="btn" type="button" hidden>转向运行中</button>
      </div>
      <div class="op-row">
        <button id="btn-pause" class="btn" type="button" hidden>暂停</button>
        <button id="btn-new-session" class="btn" type="button" hidden>新建会话</button>
        <button id="btn-end-session" class="btn danger" type="button" hidden>结束会话</button>
      </div>
      <div class="op-row">
        <select id="sel-permission" hidden></select>
        <select id="sel-model" hidden></select>
        <select id="sel-effort" hidden></select>
        <select id="sel-scope" hidden></select>
        <button id="btn-apply-model" class="btn" type="button" hidden>切换模型</button>
      </div>
      <div class="op-row" id="op-goal" hidden>
        <input id="goal-objective" placeholder="目标…" autocomplete="off" />
        <label class="chk"><input type="checkbox" id="goal-replace" />替换已有目标</label>
        <select id="sel-goal-mode"></select>
        <button id="btn-goal-set" class="btn primary" type="button">设定目标</button>
        <button id="btn-goal-pause" class="btn" type="button" hidden>暂停目标</button>
        <button id="btn-goal-resume" class="btn" type="button" hidden>恢复目标</button>
        <button id="btn-goal-cancel" class="btn" type="button" hidden>取消目标</button>
      </div>
    </footer>
    <div id="feedback-modal" class="modal" hidden>
      <div class="modal-panel">
        <p class="modal-title">该选项需要补充说明</p>
        <textarea id="feedback-input" rows="4"></textarea>
        <div class="row">
          <button id="feedback-cancel" class="btn" type="button">返回</button>
          <button id="feedback-ok" class="btn primary" type="button">提交</button>
        </div>
      </div>
    </div>
    <div id="confirm-modal" class="modal" hidden>
      <div class="modal-panel">
        <div id="confirm-body"></div>
        <div class="row">
          <button id="confirm-cancel" class="btn" type="button">返回</button>
          <button id="confirm-ok" class="btn primary" type="button">确认</button>
        </div>
      </div>
    </div>
    <script id="forum-view">
      (function (global) {
        'use strict';
        const RUNNING_PHASES = new Set(['waiting', 'thinking', 'composing', 'shell']);
        const RECEIPT_STATE_LABELS = {
          accepted: '已受理',
          delivered: '已送达',
          applied: '已生效',
          rejected: '已失效',
          lost: '已失效',
        };
        const RECEIPT_REASON_LABELS = {
          'bad-shape': '形状无效',
          'thread-unknown': '线程不存在',
          'thread-offline': '线程离线',
          'not-capable': '不支持该操作',
          'card-closed': '卡片已关闭',
          'session-busy': '会话忙',
          'not-running': '会话未运行',
          'invalid-params': '参数无效',
          'postcondition-failed': '未达目标状态',
          'not-delivered': '未送达',
          'thread-removed': '线程已移除',
          'machine-revoked': '机器凭证已吊销',
        };
        const OUTCOME_LABELS = {
          approved: '已允许',
          rejected: '已拒绝',
          cancelled: '已取消',
          answered: '已回答',
        };
        const PERMISSION_MODE_OPTIONS = [
          { value: 'manual', label: 'Always Ask' },
          { value: 'yolo', label: 'Ask When Needed' },
          { value: 'auto', label: 'Never Ask' },
        ];
        const GOAL_START_MODES = [
          { value: 'auto', label: '自动（沿用当前权限）' },
          { value: 'manual', label: 'Always Ask 下启动' },
          { value: 'yolo', label: 'Ask When Needed 下启动' },
        ];
        const SPECIAL_BLOCK_TYPES = new Set(['shell', 'diff', 'file_content', 'brief', 'plan_body']);
        const INVALID = { ok: false, reason: 'invalid-params' };

        function parseRoute(hash) {

          const sessionId = intent.sessionId;
          if (sessionId === undefined) return;
          api('/api/browser/ops', { method: 'POST', body: JSON.stringify({ sessionId, intent }) })
            .then((res) => res.json())
            .then((receipt) => {
              if (receipt !== null && typeof receipt === 'object' && receipt.opId !== undefined) {
                applyEvent({ type: 'receipt', receipt });
                render();
              }
            })
            .catch(() => {});
        };

        const confirmDialog = (build) => {
          const body = $('confirm-body');
          body.replaceChildren();
          build(body);
          $('confirm-modal').hidden = false;
          return new Promise((resolve) => {
            state.confirmResolve = resolve;
          });
        };

        const closeConfirm = (result) => {
          $('confirm-modal').hidden = true;
          const resolve = state.confirmResolve;
          state.confirmResolve = null;
          if (resolve !== null) resolve(result);
        };

        const closeFeedback = () => {
          state.feedback = null;
          $('feedback-modal').hidden = true;
        };

        const findCard = (cardId) => {
          const current = state.store.currentThread;
          if (current === undefined) return undefined;
          return current.openCards.find((card) => card.cardId === cardId);
        };

        const submitApproval = (sessionId, cardId, optionIndex, feedback) => {
          const card = findCard(cardId);
          if (card === undefined) return;
          const result = V.buildApprovalIntent(sessionId, cardId, card, optionIndex, feedback);
          if (result.ok !== true) return;
          state.pendingCards.add(cardId);
          submitOp(result.intent);
        };

        const openFeedback = (cardId, optionIndex) => {
          state.feedback = { cardId, optionIndex };
          $('feedback-input').value = '';
          $('feedback-modal').hidden = false;
          $('feedback-input').focus();
        };

        const openAnswerSummary = (sessionId, card, drafts) => {
          confirmDialog((body) => {
            body.appendChild(el('p', null, '确认提交以下作答？'));
            const list = el('ul', 'summary-list');
            for (const item of V.answerSummary(card, drafts)) {
              const li = el('li');
              li.appendChild(el('div', 'summary-q', item.question));
              li.appendChild(el('div', 'summary-a', item.answer));
              list.appendChild(li);
            }
            body.appendChild(list);
          }).then((ok) => {
            if (ok !== true) return;
            const result = V.buildAnswerIntent(sessionId, card.cardId, card, drafts);
            if (result.ok !== true) return;
            state.pendingCards.add(card.cardId);
            submitOp(result.intent);
          });
        };

        const badgeOf = (thread) => {
          const text = V.displayState(thread);
          const base = text.replace(' (offline)', '');
          const cls =
            base === 'pending'
              ? 'badge-pending'
              : base === 'compacting'
                ? 'badge-compacting'
                : base === 'idle'
                  ? 'badge-idle'
                  : 'badge-running';
          return el('span', `badge ${cls}`, text);
        };

        const summaryOf = (current) => ({
          descriptor: current.descriptor,
          overview: current.overview,
          online: current.online,
          openCards: current.openCards.map((card) => ({
            cardId: card.cardId,
            kind: card.kind,
            openedAt: card.openedAt,
          })),
          lastActivityAt: 0,
        });

        const permissionLabel = (mode) => {
          const option = V.PERMISSION_MODE_OPTIONS.find((entry) => entry.value === mode);
          return option === undefined ? mode : option.label;
        };

        const threadRow = (thread) => {
          const row = el('div', 'thread-card');
          row.appendChild(el('div', 'thread-card-title', thread.descriptor.title));
          const meta = el('div', 'thread-meta');
          meta.appendChild(badgeOf(thread));
          meta.appendChild(el('span', null, thread.descriptor.project));
          const progress = V.goalProgress(thread.overview, Date.now());
          if (progress.length > 0) meta.appendChild(el('span', 'goal-progress', progress));
          if (thread.online !== true) meta.appendChild(el('span', 'offline-flag', '离线'));
          row.appendChild(meta);
          if (thread.overview.lastLine.length > 0) row.appendChild(el('div', 'lastline', thread.overview.lastLine));
          row.addEventListener('click', () => {
            location.hash = `#/thread/${encodeURIComponent(thread.descriptor.sessionId)}`;
          });
          return row;
        };

        const renderInbox = () => {
          const threads = V.sortInbox(state.store.inbox);
          const pinned = threads.filter((thread) => thread.openCards.length > 0);
          const rest = threads.filter((thread) => thread.openCards.length === 0);
          $('inbox-pinned').hidden = pinned.length === 0;
          const pinnedList = $('pinned-list');
          pinnedList.replaceChildren();
          for (const thread of pinned) pinnedList.appendChild(threadRow(thread));
          const groups = new Map();
          for (const thread of rest) {
            const key = thread.descriptor.machine.tokenName;
            const group = groups.get(key) ?? [];
            group.push(thread);
            groups.set(key, group);
          }
          const groupBox = $('group-list');
          groupBox.replaceChildren();
          if (threads.length === 0) {
            groupBox.appendChild(el('div', 'empty', '没有已发布的会话'));
            return;
          }
          for (const [key, group] of groups) {
            const section = el('section', 'group');
            const head = el('div', 'group-header');
            head.appendChild(el('span', 'group-name', key));
            head.appendChild(el('span', 'group-host', group[0].descriptor.machine.hostname));
            section.appendChild(head);
            for (const thread of group) section.appendChild(threadRow(thread));
            groupBox.appendChild(section);
          }
        };

        const renderDevices = () => {
          const box = $('device-list');
          box.replaceChildren();
          const rows = V.deviceRows(state.devices);
          if (rows.length === 0) {
            box.appendChild(el('div', 'empty', '没有已签发的 token'));
            return;
          }
          for (const row of rows) {
            const node = el('div', 'device-row');
            const info = el('div', 'device-info');
            info.appendChild(el('div', 'device-name', row.name));
            const meta = el('div', 'device-meta');
            meta.appendChild(el('span', null, row.role === 'machine' ? '机器' : '设备'));
            const at = V.deviceCreatedAtText(row.createdAt);
            if (at.length > 0) meta.appendChild(el('span', null, `创建于 ${at}`));
            info.appendChild(meta);
            node.appendChild(info);
            const btn = el('button', 'btn danger', '吊销');
            btn.type = 'button';
            btn.addEventListener('click', () => {
              confirmDialog((body) => body.appendChild(el('p', null, `确认吊销「${row.name}」？该操作立即生效且不可恢复。`))).then(
                (ok) => {
                  if (ok !== true) return;
                  const request = V.buildRevokeRequest(row.tokenId);
                  if (request === null) return;
                  api(request.path, { method: request.method })
                    .then((res) => {
                      if (res.status === 204) refetchDevices();
                    })
                    .catch(() => {});
                },
              );
            });
            node.appendChild(btn);
            box.appendChild(node);
          }
        };

        const refetchDevices = () => {
          api('/api/browser/devices')
            .then((res) => res.json())
            .then((body) => {
              state.devices = Array.isArray(body) ? body : [];
              renderDevices();
            })
            .catch(() => {});
        };

        const renderLogin = () => {
          const error = $('login-error');
          error.hidden = true;
          error.textContent = '';
          $('login-token').value = '';
        };

        const submitLogin = () => {
          const error = $('login-error');
          const request = V.buildLoginRequest($('login-token').value);
          if (request.ok !== true) {
            error.textContent = '请粘贴设备 token';
            error.hidden = false;
            return;
          }
          $('btn-login').disabled = true;
          fetch('/api/browser/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: request.body })
            .then((res) => {
              $('btn-login').disabled = false;
              if (res.status === 204) {
                state.authed = true;
                if (location.hash === '#/' || location.hash === '') route();
                else location.hash = '#/';
                return;
              }
              error.textContent = V.loginErrorText(res.status);
              error.hidden = false;
            })
            .catch(() => {
              $('btn-login').disabled = false;
              error.textContent = V.loginErrorText(0);
              error.hidden = false;
            });
        };

        const wideScreen = () => window.matchMedia('(min-width: 641px)').matches;

        const renderShell = (wrap, block) => {
          if (block.danger !== undefined && block.danger !== null) {
            wrap.appendChild(el('span', 'danger-tag', `危险：${block.danger}`));
          }
          if (typeof block.cwd === 'string' && block.cwd.length > 0) {
            wrap.appendChild(el('div', 'block-path mono', block.cwd));
          }
          const pre = el('pre', 'block-code');
          pre.textContent = typeof block.command === 'string' ? block.command : '';
          wrap.appendChild(pre);
        };

        const renderDiff = (wrap, block) => {
          const details = el('details', 'diff-details');
          if (wideScreen()) details.open = true;
          const summary = el('summary');
          summary.appendChild(
            el('span', 'block-path mono', typeof block.path === 'string' ? block.path : 'diff'),
          );
          details.appendChild(summary);
          const body = el('div', 'diff-body');
          const lines = Array.isArray(block.lines) ? block.lines : [];
          if (lines.length === 0) {
            body.appendChild(el('div', 'empty', '无差异行'));
          } else {
            for (const line of lines) {
              const row = el('div', `diff-row diff-${line.op}`);
              row.appendChild(el('span', 'diff-no', line.oldNo !== undefined ? String(line.oldNo) : ''));
              row.appendChild(el('span', 'diff-no', line.newNo !== undefined ? String(line.newNo) : ''));
              row.appendChild(el('span', 'diff-text', typeof line.text === 'string' ? line.text : ''));
              body.appendChild(row);
            }
          }
          details.appendChild(body);
          wrap.appendChild(details);
        };

        const renderFileContent = (wrap, block) => {
          wrap.appendChild(el('div', 'block-path mono', typeof block.path === 'string' ? block.path : ''));
          const pre = el('pre', 'block-code');
          pre.textContent = typeof block.content === 'string' ? block.content : '';
          wrap.appendChild(pre);
        };

        const renderBrief = (wrap, block) => {
          const p = el('p', 'block-brief');
          p.textContent = typeof block.text === 'string' ? block.text : '';
          wrap.appendChild(p);
        };

        const renderPlanBody = (wrap, block) => {
          wrap.appendChild(el('div', 'block-label', '计划正文'));
          const pre = el('pre', 'block-code');
          pre.textContent = typeof block.text === 'string' ? block.text : '';
          wrap.appendChild(pre);
        };

        const renderUnknown = (wrap, block) => {
          wrap.appendChild(el('div', 'block-label', V.blockSummary(block)));
          const details = el('details', 'raw-details');
          details.appendChild(el('summary', null, '原始字段'));
          const list = el('dl', 'raw-list');
          for (const [key, value] of V.blockFields(block)) {
            list.appendChild(el('dt', null, key));
            const dd = el('dd');
            dd.textContent = value;
            list.appendChild(dd);
          }
          details.appendChild(list);
          wrap.appendChild(details);
        };

        const renderBlock = (block) => {
          const kind = V.classifyBlock(block);
          const wrap = el('div', `block block-${kind}`);
          if (kind === 'shell') renderShell(wrap, block);
          else if (kind === 'diff') renderDiff(wrap, block);
          else if (kind === 'file_content') renderFileContent(wrap, block);
          else if (kind === 'brief') renderBrief(wrap, block);
          else if (kind === 'plan_body') renderPlanBody(wrap, block);
          else renderUnknown(wrap, block);
          return wrap;
        };

        const cancelRow = (current, card, kind) => {
          const row = el('div', 'card-actions');
          const btn = el('button', 'btn', '取消（= Esc）');
          btn.type = 'button';
          btn.disabled = state.pendingCards.has(card.cardId) || current.online !== true;
          btn.addEventListener('click', () => {
            const intent =
              kind === 'approval'
                ? V.buildApprovalCancelIntent(current.sessionId, card.cardId)
                : V.buildAnswerCancelIntent(current.sessionId, card.cardId);
            state.pendingCards.add(card.cardId);
            submitOp(intent);
          });
          row.appendChild(btn);
          if (state.pendingCards.has(card.cardId)) row.appendChild(el('span', 'card-note', '已发送，等待回执'));
          return row;
        };

        const renderApprovalCard = (node, current, card) => {
          const approval = card.approval ?? {};
          const tool = el('div', 'card-tool');
          tool.appendChild(el('span', 'tool-name', approval.tool_name ?? ''));
          tool.appendChild(el('span', 'tool-action', approval.action ?? ''));
          node.appendChild(tool);
          if (typeof approval.description === 'string' && approval.description.length > 0) {
            node.appendChild(el('p', 'card-desc', approval.description));
          }
          const display = Array.isArray(approval.display) ? approval.display : [];
          for (const block of display) node.appendChild(renderBlock(block));
          const pending = state.pendingCards.has(card.cardId);
          const offline = current.online !== true;
          const choices = Array.isArray(approval.choices) ? approval.choices : [];
          const box = el('div', 'options');
          choices.forEach((choice, index) => {
            const btn = el('button', 'option');
            btn.type = 'button';
            btn.appendChild(el('span', 'option-label', choice.label ?? `选项 ${index + 1}`));
            if (typeof choice.description === 'string' && choice.description.length > 0) {
              btn.appendChild(el('span', 'option-desc', choice.description));
            }
            if (choice.requires_feedback === true) btn.appendChild(el('span', 'option-flag', '需补充说明'));
            btn.disabled = pending || offline;
            btn.addEventListener('click', () => {
              if (choice.requires_feedback === true) openFeedback(card.cardId, index);
              else submitApproval(current.sessionId, card.cardId, index, undefined);
            });
            box.appendChild(btn);
          });
          node.appendChild(box);
          node.appendChild(cancelRow(current, card, 'approval'));
        };

        const draftOf = (card) => {
          let draft = state.drafts.get(card.cardId);
          if (draft === undefined) {
            draft = V.newAnswerDrafts(card);
            state.drafts.set(card.cardId, draft);
          }
          return draft;
        };

        const renderQuestionCard = (node, current, card) => {
          const items = Array.isArray(card.question && card.question.questions) ? card.question.questions : [];
          const drafts = draftOf(card);
          const pending = state.pendingCards.has(card.cardId);
          const offline = current.online !== true;
          items.forEach((item, index) => {
            const draft = drafts[index];
            const block = el('div', 'q-item');
            block.appendChild(el('div', 'q-title', item.question ?? `问题 ${index + 1}`));
            if (typeof item.header === 'string' && item.header.length > 0) {
              block.appendChild(el('div', 'q-header', item.header));
            }
            if (typeof item.body === 'string' && item.body.length > 0) {
              block.appendChild(el('div', 'q-body', item.body));
            }
            const box = el('div', 'options');
            const options = Array.isArray(item.options) ? item.options : [];
            options.forEach((option, optionIndex) => {
              const btn = el('button', 'option');
              btn.type = 'button';
              btn.appendChild(el('span', 'option-label', option.label ?? `选项 ${optionIndex + 1}`));
              if (typeof option.description === 'string' && option.description.length > 0) {
                btn.appendChild(el('span', 'option-desc', option.description));
              }
              if (draft.selected.includes(optionIndex)) btn.classList.add('chosen');
              btn.disabled = pending || offline;
              btn.addEventListener('click', () => {
                if (item.multi_select === true) {
                  const at = draft.selected.indexOf(optionIndex);
                  if (at === -1) draft.selected.push(optionIndex);
                  else draft.selected.splice(at, 1);
                } else {
                  draft.selected = draft.selected[0] === optionIndex ? [] : [optionIndex];
                }
                render();
              });
              box.appendChild(btn);
            });
            block.appendChild(box);
            const input = el('textarea', 'free-input');
            input.rows = 2;
            input.placeholder = typeof item.other_label === 'string' ? item.other_label : '自由输入';
            input.value = draft.freeText;
            input.disabled = pending || offline;
            input.addEventListener('input', () => {
              draft.freeText = input.value;
            });
            block.appendChild(input);
            node.appendChild(block);
          });
          const row = el('div', 'card-actions');
          const confirmBtn = el('button', 'btn primary', '汇总确认');
          confirmBtn.type = 'button';
          confirmBtn.disabled = pending || offline || V.answerDraftReady(card, drafts) !== true;
          confirmBtn.addEventListener('click', () => {
            openAnswerSummary(current.sessionId, card, drafts);
          });
          row.appendChild(confirmBtn);
          node.appendChild(row);
          node.appendChild(cancelRow(current, card, 'question'));
        };

        const renderCard = (current, card) => {
          const node = el('section', `card card-${card.kind}`);
          node.id = `card-${card.cardId}`;
          node.appendChild(el('div', 'card-kind', card.kind === 'approval' ? '审批卡片' : '问题卡片'));
          if (card.truncated === true) node.appendChild(el('div', 'trunc-note', '已截断，完整内容见本地'));
          if (card.kind === 'approval') renderApprovalCard(node, current, card);
          else renderQuestionCard(node, current, card);
          return node;
        };

        const maybeScrollToCard = () => {
          const cardId = state.route.cardId;
          if (cardId === undefined || state.scrolledCard === cardId) return;
          const target = document.getElementById(`card-${cardId}`) ?? $('closed-card-slot');
          if (target === null || target.hidden) return;
          state.scrolledCard = cardId;
          target.scrollIntoView({ block: 'start' });
        };

        const renderHead = (current) => {
          const head = $('thread-head');
          head.replaceChildren();
          const descriptor = current.descriptor;
          head.appendChild(el('div', 'thread-title', descriptor.title));
          const meta = el('div', 'thread-meta');
          meta.appendChild(badgeOf(summaryOf(current)));
          meta.appendChild(el('span', null, descriptor.project));
          meta.appendChild(el('span', null, `${descriptor.machine.tokenName} · ${descriptor.machine.hostname}`));
          meta.appendChild(el('span', 'mono', current.sessionId.slice(0, 8)));
          if (current.online !== true) meta.appendChild(el('span', 'offline-flag', '离线'));
          head.appendChild(meta);
          const info = el('div', 'thread-info');
          info.appendChild(
            el('span', null, `模型 ${current.overview.model} · ${current.overview.thinkingEffort}`),
          );
          info.appendChild(el('span', null, `权限 ${permissionLabel(current.overview.permissionMode)}`));
          const progress = V.goalProgress(current.overview, Date.now());
          if (progress.length > 0) info.appendChild(el('span', 'goal-progress', `目标进度 ${progress}`));
          head.appendChild(info);
          const goal = current.overview.goal;
          if (goal !== null && goal !== undefined && typeof goal.objective === 'string') {
            head.appendChild(el('div', 'goal-objective', goal.objective));
          }
          const todos = Array.isArray(current.overview.todos) ? current.overview.todos : [];
          if (todos.length > 0) {
            const list = el('ul', 'todo-list');
            for (const todo of todos) list.appendChild(el('li', `todo todo-${todo.status}`, todo.title));
            head.appendChild(list);
          }
        };

        const renderClosedCard = (current) => {
          const slot = $('closed-card-slot');
          slot.replaceChildren();
          const cardId = state.route.cardId;
          if (cardId === undefined) {
            slot.hidden = true;
            return;
          }
          const view = V.deepLinkCardView(current.openCards, current.timeline, cardId);
          if (view.status === 'open' || view.status === 'none') {
            slot.hidden = true;
            return;
          }
          slot.hidden = false;
          const node = el('div', 'card card-closed');
          if (view.status === 'closed') {
            node.appendChild(el('div', 'card-kind', '已关闭'));
            const outcome = V.OUTCOME_LABELS[view.outcome] ?? view.outcome;
            node.appendChild(el('div', 'card-outcome', `结果：${outcome}`));
          } else {
            node.appendChild(el('div', 'card-kind', '未找到卡片'));
            node.appendChild(el('div', 'card-outcome', '该卡片不存在或已被移除'));
          }
          slot.appendChild(node);
        };

        const renderOpenCards = (current) => {
          const box = $('open-cards');
          box.replaceChildren();
          if (current.openCards.length === 0) {
            box.appendChild(el('div', 'empty', '当前没有开放卡片'));
            return;
          }
          for (const card of current.openCards) box.appendChild(renderCard(current, card));
          maybeScrollToCard();
        };

        const tlMarker = (text) => {
          const line = el('div', 'tl-status');
          line.appendChild(el('span', 'dot'));
          line.appendChild(el('span', null, text));
          return line;
        };

        const renderEntry = (entry) => {
          const li = el('li', 'tl-item');
          if (entry.kind === 'user-message' || entry.kind === 'assistant-turn') {
            const bubble = el('div', `msg msg-${entry.kind === 'user-message' ? 'user' : 'assistant'}`);
            bubble.appendChild(el('span', 'msg-role', entry.kind === 'user-message' ? '用户' : '助手'));
            bubble.appendChild(el('div', 'msg-text', entry.text ?? ''));
            if (entry.truncated === true) bubble.appendChild(el('span', 'msg-trunc', '已截断，完整内容见本地'));
            li.appendChild(bubble);
            return li;
          }
          if (entry.kind === 'tool-call') {
            const line = el('div', 'tl-mono');
            line.textContent = `工具 ${entry.name} ${entry.keyArg ?? ''}`;
            li.appendChild(line);
            return li;
          }
          if (entry.kind === 'tool-result') {
            const line = el('div', `tl-mono${entry.ok === true ? '' : ' tl-fail'}`);
            line.textContent = `结果 ${entry.ok === true ? '成功' : '失败'}${entry.chip !== undefined ? ` · ${entry.chip}` : ''}`;
            li.appendChild(line);
            return li;
          }
          if (entry.kind === 'card-opened') {
            li.appendChild(tlMarker(`卡片开启 · ${entry.card !== undefined ? entry.card.cardId : ''}`));
            return li;
          }
          if (entry.kind === 'card-settled') {
            li.appendChild(tlMarker(`卡片已处理 · ${V.OUTCOME_LABELS[entry.outcome] ?? entry.outcome}`));
            return li;
          }
          li.appendChild(tlMarker(`状态切换为 ${entry.phase ?? ''}`));
          return li;
        };

        const renderTimeline = (current) => {
          const list = $('timeline');
          list.replaceChildren();
          if (current.timeline.length === 0) {
            list.appendChild(el('div', 'empty', '暂无时间线'));
            return;
          }
          for (const entry of current.timeline) list.appendChild(renderEntry(entry));
        };

        const renderReceipts = (current) => {
          const list = $('receipts');
          list.replaceChildren();
          if (current.receipts.length === 0) {
            list.appendChild(el('div', 'empty', '暂无回执'));
            return;
          }
          for (const receipt of current.receipts) {
            const item = el('li', 'receipt-item');
            item.appendChild(el('span', 'mono', receipt.opType));
            item.appendChild(el('span', `receipt-badge receipt-${receipt.state}`, V.receiptBadge(receipt).text));
            list.appendChild(item);
          }
        };

        const refreshEfforts = (current) => {
          const modelSel = $('sel-model');
          const effortSel = $('sel-effort');
          const models = Array.isArray(current.overview.models) ? current.overview.models : [];
          const model = models.find((entry) => entry.alias === modelSel.value) ?? models[0];
          effortSel.replaceChildren();
          const efforts = model !== undefined && Array.isArray(model.efforts) ? model.efforts : [];
          for (const effort of efforts) {
            const opt = el('option', null, effort);
            opt.value = effort;
            if (effort === current.overview.thinkingEffort) opt.selected = true;
            effortSel.appendChild(opt);
          }
        };

        const renderActionBar = (current) => {
          const acts = V.actionBarActions(current.descriptor.capabilities, current.online);
          const disabled = acts.enabled !== true;
          const toggle = (id, shown) => {
            const node = $(id);
            node.hidden = shown !== true;
            node.disabled = disabled;
            return node;
          };
          const textInput = $('op-text');
          textInput.hidden = !(acts.send || acts.steer);
          textInput.disabled = disabled;
          textInput.value = state.opText;
          toggle('btn-send', acts.send);
          toggle('btn-steer', acts.steer);
          toggle('btn-pause', acts.pause);
          toggle('btn-new-session', acts.newSession);
          toggle('btn-end-session', acts.endSession);
          const permSel = toggle('sel-permission', acts.permissionMode);
          if (acts.permissionMode) {
            permSel.replaceChildren();
            for (const mode of V.PERMISSION_MODE_OPTIONS) {
              const opt = el('option', null, mode.label);
              opt.value = mode.value;
              if (mode.value === current.overview.permissionMode) opt.selected = true;
              permSel.appendChild(opt);
            }
          }
          const modelSel = toggle('sel-model', acts.switchModel);
          const effortSel = toggle('sel-effort', acts.switchModel);
          const scopeSel = toggle('sel-scope', acts.switchModel);
          toggle('btn-apply-model', acts.switchModel);
          if (acts.switchModel) {
            const models = Array.isArray(current.overview.models) ? current.overview.models : [];
            modelSel.replaceChildren();
            for (const model of models) {
              const opt = el('option', null, model.displayName ?? model.alias);
              opt.value = model.alias;
              if (model.alias === current.overview.model) opt.selected = true;
              modelSel.appendChild(opt);
            }
            refreshEfforts(current);
            scopeSel.replaceChildren();
            for (const scope of ['session', 'persist']) {
              const opt = el('option', null, scope === 'session' ? '本会话' : '持久');
              opt.value = scope;
              scopeSel.appendChild(opt);
            }
          }
          const goalActive = current.overview.goal !== null && current.overview.goal !== undefined;
          const goalRow = $('op-goal');
          goalRow.hidden = !(acts.goalSet || ((acts.goalPause || acts.goalResume || acts.goalCancel) && goalActive));
          const goalInput = $('goal-objective');
          goalInput.hidden = !acts.goalSet;
          goalInput.disabled = disabled;
          goalInput.value = state.goalObjective;
          $('goal-replace').disabled = disabled;
          toggle('btn-goal-set', acts.goalSet);
          toggle('btn-goal-pause', acts.goalPause && goalActive);
          toggle('btn-goal-resume', acts.goalResume && goalActive);
          toggle('btn-goal-cancel', acts.goalCancel && goalActive);
          const modeSel = $('sel-goal-mode');
          modeSel.hidden = !acts.goalSet;
          modeSel.disabled = disabled;
          if (acts.goalSet) {
            modeSel.replaceChildren();
            for (const mode of V.GOAL_START_MODES) {
              const opt = el('option', null, mode.label);
              opt.value = mode.value;
              modeSel.appendChild(opt);
            }
          }
        };

        const renderOfflineRemove = (current) => {
          const slot = $('offline-thread-actions');
          slot.replaceChildren();
          if (V.showThreadRemove(current) !== true) {
            slot.hidden = true;
            return;
          }
          slot.hidden = false;
          const row = el('div', 'btn-row');
          const btn = el('button', 'btn danger', '移除此离线线程');
          btn.type = 'button';
          btn.addEventListener('click', () => {
            confirmDialog((body) => body.appendChild(el('p', null, '确认移除该离线线程？其回执与卡片记录将一并删除。'))).then(
              (ok) => {
                if (ok !== true) return;
                const request = V.buildThreadRemoveRequest(current.sessionId);
                if (request === null) return;
                api(request.path, { method: request.method })
                  .then((res) => {
                    if (res.status === 204) location.hash = '#/';
                  })
                  .catch(() => {});
              },
            );
          });
          row.appendChild(btn);
          slot.appendChild(row);
        };

        const renderThread = () => {
          const current = state.store.currentThread;
          if (current === undefined || current.sessionId !== state.route.sessionId) {
            $('thread-head').replaceChildren(el('div', 'empty', '加载中…'));
            $('offline-thread-actions').hidden = true;
            $('closed-card-slot').hidden = true;
            $('open-cards').replaceChildren();
            $('timeline').replaceChildren();
            $('receipts').replaceChildren();
            $('action-bar').hidden = true;
            return;
          }
          renderHead(current);
          renderOfflineRemove(current);
          renderClosedCard(current);
          renderOpenCards(current);
          renderTimeline(current);
          renderReceipts(current);
          renderActionBar(current);
        };

        const render = () => {
          if (state.route.name === 'login') renderLogin();
          else if (state.route.name === 'devices') renderDevices();
          else if (state.route.name === 'thread') renderThread();
          else renderInbox();
        };

        const submitText = (preferred) => {
          const current = state.store.currentThread;
          if (current === undefined) return;
          const caps = new Set(current.descriptor.capabilities);
          const type = caps.has(preferred) ? preferred : caps.has('send') ? 'send' : 'steer';
          const input = $('op-text');
          const text = input.value.trim();
          if (text.length === 0) return;
          input.value = '';
          state.opText = '';
          submitOp({ type, sessionId: state.route.sessionId, text });
        };

        const initActionBar = () => {
          $('op-text').addEventListener('input', (event) => {
            state.opText = event.target.value;
          });
          $('op-text').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') submitText('send');
          });
          $('btn-send').addEventListener('click', () => submitText('send'));
          $('btn-steer').addEventListener('click', () => submitText('steer'));
          $('btn-pause').addEventListener('click', () => {
            submitOp({ type: 'pause', sessionId: state.route.sessionId });
          });
          $('btn-new-session').addEventListener('click', () => {
            confirmDialog((body) => body.appendChild(el('p', null, '确认新建会话？'))).then((ok) => {
              if (ok === true) submitOp({ type: 'new-session', sessionId: state.route.sessionId });
            });
          });
          $('btn-end-session').addEventListener('click', () => {
            confirmDialog((body) => body.appendChild(el('p', null, '确认结束会话？'))).then((ok) => {
              if (ok === true) submitOp({ type: 'end-session', sessionId: state.route.sessionId });
            });
          });
          $('sel-permission').addEventListener('change', (event) => {
            submitOp({
              type: 'set-permission-mode',
              sessionId: state.route.sessionId,
              mode: event.target.value,
            });
          });
          $('sel-model').addEventListener('change', () => {
            const current = state.store.currentThread;
            if (current !== undefined) refreshEfforts(current);
          });
          $('btn-apply-model').addEventListener('click', () => {
            submitOp({
              type: 'switch-model',
              sessionId: state.route.sessionId,
              alias: $('sel-model').value,
              effort: $('sel-effort').value,
              scope: $('sel-scope').value,
            });
          });
          $('goal-objective').addEventListener('input', (event) => {
            state.goalObjective = event.target.value;
          });
          $('btn-goal-set').addEventListener('click', () => {
            const result = V.buildGoalSetIntent(
              state.route.sessionId,
              $('goal-objective').value,
              $('goal-replace').checked,
              $('sel-goal-mode').value,
            );
            if (result.ok !== true) return;
            submitOp(result.intent);
          });
          $('btn-goal-pause').addEventListener('click', () => {
            submitOp({ type: 'goal-pause', sessionId: state.route.sessionId });
          });
          $('btn-goal-resume').addEventListener('click', () => {
            submitOp({ type: 'goal-resume', sessionId: state.route.sessionId });
          });
          $('btn-goal-cancel').addEventListener('click', () => {
            submitOp({ type: 'goal-cancel', sessionId: state.route.sessionId });
          });
        };

        const route = () => {
          state.route = V.parseRoute(location.hash);
          state.scrolledCard = null;
          showNotice('');
          $('action-bar').hidden = true;
          if (state.authed !== true) {
            if (state.route.name !== 'login') {
              location.hash = '#/login';
              return;
            }
            showViews('login');
            render();
            return;
          }
          if (state.route.name === 'login') {
            location.hash = '#/';
            return;
          }
          if (state.es === null) connectStream();
          if (state.route.name === 'thread') {
            showViews('thread');
            refetchThread(state.route.sessionId);
          } else if (state.route.name === 'devices') {
            showViews('devices');
            refetchDevices();
          } else {
            showViews('inbox');
            refetchInbox();
          }
          render();
        };

        $('btn-back').addEventListener('click', () => {
          location.hash = '#/';
        });
        $('btn-devices-back').addEventListener('click', () => {
          location.hash = '#/';
        });
        $('btn-login').addEventListener('click', submitLogin);
        $('login-token').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') submitLogin();
        });
        $('confirm-ok').addEventListener('click', () => closeConfirm(true));
        $('confirm-cancel').addEventListener('click', () => closeConfirm(false));
        $('feedback-cancel').addEventListener('click', closeFeedback);
        $('feedback-ok').addEventListener('click', () => {
          const info = state.feedback;
          if (info === null) return;
          const text = $('feedback-input').value;
          const current = state.store.currentThread;
          closeFeedback();
          if (current !== undefined) submitApproval(current.sessionId, info.cardId, info.optionIndex, text);
        });
        document.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          if (!$('feedback-modal').hidden) {
            closeFeedback();
            return;
          }
          if (!$('confirm-modal').hidden) closeConfirm(false);
        });
        const boot = () => {
          fetch('/api/browser/inbox')
            .then((res) => {
              if (res.status === 401) {
                route();
                return;
              }
              state.authed = true;
              route();
            })
            .catch(() => route());
        };

        window.addEventListener('hashchange', route);
        initActionBar();
        boot();
      })();
    </script>
  </body>
</html>
